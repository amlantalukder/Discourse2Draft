services:
  postgres:
    image: postgres:17.9
    container_name: discourse2draft-postgres
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-discourse2draft-db}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:1.3.0
    container_name: discourse2draft-chroma
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /chroma/chroma
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: discourse2draft-backend:latest
    container_name: discourse2draft-backend
    working_dir: /app/backend
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    ports:
      - "8012:8012"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/.env:/app/backend/.env:ro
      - backend_data:/app/backend/data
      - backend_logs:/app/backend/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8012/api/health'', timeout=5)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: discourse2draft-frontend:latest
    container_name: discourse2draft-frontend
    working_dir: /app/frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8012

volumes:
  postgres_data:
  chroma_data:
  backend_data:
  backend_logs:
